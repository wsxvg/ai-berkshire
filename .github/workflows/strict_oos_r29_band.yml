# R29 Strict OOS — 回调深度分层 (深跌 vs 浅跌信号给不同 boost)
# 背景: R24-R28 已确认 WIDE 配置(回调-15~-2%+amount top3)是信号甜点位,
#   回调窗口/boost/线路/topN/动量门控/信号有效期 6 维度全验证到头 (~+0.86%)。
# R29 转向回调深度分层: R24 证明宽回调最优, 但未测深度段内部谁更强。
#   深跌(-15~-8%, 大佬逆势重仓抄底) vs 浅跌(-8~-2%, 顺势加仓)谁该给更高 boost?
#   ci1: cb_band_mode=deep_boost   深×1.5 浅×0.8 → 重仓深跌
#   ci2: cb_band_mode=shallow_boost 深×0.8 浅×1.5 → 重仓浅跌
#   ci3: cb_band_mode=deep_only   只保留深(-15~-10%)boost, 浅归零 → 只做深度抄底
# 全部基于 WIDE 最优配置 + amount top3 信号。BASELINE(ci0) 复用 R21 ci0。
#
# 块窗口划分 (test windows wi21-42):
#   b0: wi 21-28   b1: wi 29-35   b2: wi 36-42

name: R29 OOS Smart Money Callback Band

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        b: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: Decompress data
        run: |
          cd backtest/data
          gunzip -kf fund_charts.json.gz 2>/dev/null || true
          cd ../..

      - name: Run R29 candidates windows block ${{ matrix.b }}
        run: |
          START=(21 29 36)
          END=(28 35 42)
          b=${{ matrix.b }}
          for ci in 1 2 3; do
            for (( wi=${START[$b]}; wi<=${END[$b]}; wi++ )); do
              echo "[ci=$ci wi=$wi] $(date '+%H:%M')"
              timeout 1500 python scripts/exp_strict_oos_r29.py run "$ci" "$wi" 2>&1 | tail -1 || echo "SKIP ci=$ci wi=$wi (timeout/error)"
            done
          done

      - name: Count produced files
        run: |
          echo "R29 test files: $(ls strict_test_r29_ci*.json 2>/dev/null | wc -l)"
          ls strict_test_r29_ci*.json 2>/dev/null

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-band-b${{ matrix.b }}
          path: strict_test_r29_ci*.json
          if-no-files-found: warn

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Consolidate R29 result files to repo root
        run: |
          mkdir -p v9-results
          find ./artifacts -name 'strict_test_r29_ci*.json' -exec cp {} ./ \;
          echo "R29 test files: $(ls strict_test_r29_ci*.json 2>/dev/null | wc -l)"
          echo "R21 baseline files (from repo): $(ls strict_test_ci0_wi*.json 2>/dev/null | wc -l)"

      - name: OOS Evaluation
        run: python scripts/exp_strict_oos_r29.py test

      - name: Commit results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v9-results/strict_oos_r29_eval.json
          if git diff --cached --quiet; then
            echo "No changes to commit (eval file already up to date)."
          else
            git commit -m "R29 OOS eval: smart money callback band (deep/shallow boost)"
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null || git push origin "HEAD:master"