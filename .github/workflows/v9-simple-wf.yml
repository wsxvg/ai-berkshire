name: V9 Simple Walk-Forward (Fast)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        wf_window: [0, 1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install chinese_calendar
      - uses: actions/cache@v4
        with:
          path: |
            backtest/data
            data/fund_cache
            data/fund_name_map.json
            data/watchlist.json
          key: trading-data-v7-${{ hashFiles('backtest/data/trading_by_date_fixed.json') }}
          restore-keys: |
            trading-data-v6-
            trading-data-v5-
            trading-data-v4-
            trading-data-

      - name: Run WF Window ${{ matrix.wf_window }}
        run: |
          python -c "
          import sys, json, copy
          sys.path.insert(0, '.')
          from backtest.engine.backtest import run_backtest

          # 窗口定义：6月训练→3月测试，滑动1月
          WINDOWS = [
              ('2023-07-17', '2024-01-17', '2024-01-17', '2024-04-17'),
              ('2023-08-17', '2024-02-17', '2024-02-17', '2024-05-17'),
              ('2023-09-17', '2024-03-17', '2024-03-17', '2024-06-17'),
              ('2023-10-17', '2024-04-17', '2024-04-17', '2024-07-17'),
              ('2023-11-17', '2024-05-17', '2024-05-17', '2024-08-17'),
              ('2023-12-17', '2024-06-17', '2024-06-17', '2024-09-17'),
              ('2024-01-17', '2024-07-17', '2024-07-17', '2024-10-17'),
              ('2024-02-17', '2024-08-17', '2024-08-17', '2024-11-17'),
              ('2024-03-17', '2024-09-17', '2024-09-17', '2026-07-24'),
          ]

          wi = ${{ matrix.wf_window }}
          ts, te, tts, tte = WINDOWS[wi]
          print(f'=== Window {wi}: Train {ts}~{te} | Test {ts}~{tte} ===')

          base = {
              'initial_cash': 10000,
              'weights': {'quality': 25, 'cost': 20, 'manager': 20, 'momentum': 15, 'smart_money': 20},
              'no_stop_loss': True,
              'take_profit_pct': 0.50,
              'pyramiding_enabled': False,
              'smart_swap': True,
              'regime_specific': True,
              'step_take_profit': True,
          }

          # 只测 2 个配置（不搜索参数）
          CONFIGS = [
              ('V8_CHAMPION', {'min_score': 3.0, 'kelly_cap_bull': 0.5, 'min_consensus': 3, 'max_holdings': 5, 'kelly_cap_bear': 0.25}),
              ('V9_IMPROVED', {'min_score': 2.5, 'kelly_cap_bull': 0.4, 'min_consensus': 3, 'max_holdings': 5, 'kelly_cap_bear': 0.25, 'consensus_window_days': 5}),
          ]

          results = {}
          for label, params in CONFIGS:
              train_cfg = copy.deepcopy(base)
              train_cfg.update(params)
              train_cfg['start_date'] = ts
              train_cfg['end_date'] = te
              train_res = run_backtest(train_cfg, clear_cache=(label==CONFIGS[0][0]))

              test_cfg = copy.deepcopy(base)
              test_cfg.update(params)
              test_cfg['start_date'] = tts
              test_cfg['end_date'] = tte
              test_res = run_backtest(test_cfg, clear_cache=False)

              results[label] = {
                  'train_return': train_res.get('total_return', 0),
                  'train_drawdown': train_res.get('max_drawdown', 0),
                  'test_return': test_res.get('total_return', 0),
                  'test_drawdown': test_res.get('max_drawdown', 0),
                  'test_sharpe': test_res.get('sharpe_ratio', 0),
                  'test_trades': test_res.get('trade_count', 0),
              }
              print(f'  {label}: Train={train_res.get(\"total_return\",0):.1f}%, Test={test_res.get(\"total_return\",0):.1f}%, DD={test_res.get(\"max_drawdown\",0):.1f}%')

          output = {
              'window': wi,
              'train_period': f'{ts}~{te}',
              'test_period': f'{ts}~{tte}',
              'results': results,
          }

          with open(f'wf_simple_${{ matrix.wf_window }}.json', 'w') as f:
              json.dump(output, f, indent=2)

      - uses: actions/upload-artifact@v4
        with:
          name: wf-simple-${{ matrix.wf_window }}
          path: wf_simple_${{ matrix.wf_window }}.json

  summarize:
    needs: walkforward
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: wf-simple-artifacts
          pattern: wf-simple-*

      - name: Summarize
        run: |
          python -c "
          import json, glob, statistics

          windows = []
          for f in sorted(glob.glob('wf-simple-artifacts/*/wf_simple_*.json')):
              with open(f) as fh:
                  windows.append(json.load(fh))

          windows.sort(key=lambda x: x['window'])

          print('='*100)
          print('V9 Simple Walk-Forward: V8 Champion vs V9 Improved')
          print('='*100)
          print(f\"{'Win':<4} {'Train':<22} {'Test':<22} || {'V8 Train':>9} {'V8 Test':>9} {'V8 DD':>7} || {'V9 Train':>9} {'V9 Test':>9} {'V9 DD':>7}\")
          print('-'*100)

          v8_test_rets = []
          v9_test_rets = []

          for w in windows:
              v8 = w['results']['V8_CHAMPION']
              v9 = w['results']['V9_IMPROVED']
              print(f\"{w['window']:<4} {w['train_period']:<22} {w['test_period']:<22} || {v8['train_return']:>8.1f}% {v8['test_return']:>8.1f}% {v8['test_drawdown']:>6.1f}% || {v9['train_return']:>8.1f}% {v9['test_return']:>8.1f}% {v9['test_drawdown']:>6.1f}%\")
              v8_test_rets.append(v8['test_return'])
              v9_test_rets.append(v9['test_return'])

          print(f\"\\nSummary:\")
          print(f\"  V8 Test:  avg={statistics.mean(v8_test_rets):.1f}%, median={statistics.median(v8_test_rets):.1f}%, total={sum(v8_test_rets):.1f}%\")
          print(f\"  V9 Test:  avg={statistics.mean(v9_test_rets):.1f}%, median={statistics.median(v9_test_rets):.1f}%, total={sum(v9_test_rets):.1f}%\")

          summary = {
              'strategy': 'V9 Simple WF (2 configs only)',
              'windows': windows,
              'stats': {
                  'v8_avg_test': statistics.mean(v8_test_rets),
                  'v9_avg_test': statistics.mean(v9_test_rets),
              }
          }
          with open('v9_simple_wf_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          print('\\nSaved: v9_simple_wf_summary.json')
          "

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A v9-results/ 2>/dev/null || true
          mkdir -p v9-results
          cp v9_simple_wf_summary.json v9-results/ 2>/dev/null || true
          git add v9-results/v9_simple_wf_summary.json
          git diff --cached --quiet || git commit -m "V9 Simple WF results $(date +%Y%m%d-%H%M)"
          git push
