# R27 Strict OOS — 信号组合过滤: 回调 + 动量门控
# 背景: R24-R26 已确认 WIDE 配置(回调-15~-2%+amount top3)是信号甜点位,
#   回调/boost/线路/topN 4 维度全验证到头 (~+0.86%)。
# R27 转向信号组合过滤: "回调+动量门控"——只在基金中期趋势向上(momentum_score达标)
#   时才给加成, 剔除"大佬抄底抄在半山腰"的趋势向下信号。
#   ci1: mom_gate=2.5  (过滤明显下跌趋势)
#   ci2: mom_gate=3.0  (中期趋势偏多才给加成)
#   ci3: mom_gate=3.5  (严格动量门控, 只接强趋势回调)
# 全部基于 WIDE 最优配置 + amount top3 信号。mom_gate 通过 sm_params 传引擎。
# BASELINE(ci0) 复用 R21 strict_test_ci0_wi*.json。
#
# 块窗口划分 (test windows wi21-42):
#   b0: wi 21-28   b1: wi 29-35   b2: wi 36-42

name: R27 OOS Smart Money Momentum Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        b: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: Decompress data
        run: |
          cd backtest/data
          gunzip -kf fund_charts.json.gz 2>/dev/null || true
          cd ../..

      - name: Run R27 candidates windows block ${{ matrix.b }}
        run: |
          START=(21 29 36)
          END=(28 35 42)
          b=${{ matrix.b }}
          for ci in 1 2 3; do
            for (( wi=${START[$b]}; wi<=${END[$b]}; wi++ )); do
              echo "[ci=$ci wi=$wi] $(date '+%H:%M')"
              timeout 1500 python scripts/exp_strict_oos_r27.py run "$ci" "$wi" 2>&1 | tail -1 || echo "SKIP ci=$ci wi=$wi (timeout/error)"
            done
          done

      - name: Count produced files
        run: |
          echo "R27 test files: $(ls strict_test_r27_ci*.json 2>/dev/null | wc -l)"
          ls strict_test_r27_ci*.json 2>/dev/null

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r27-mom-b${{ matrix.b }}
          path: strict_test_r27_ci*.json
          if-no-files-found: warn

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Consolidate R27 result files to repo root
        run: |
          mkdir -p v9-results
          find ./artifacts -name 'strict_test_r27_ci*.json' -exec cp {} ./ \;
          echo "R27 test files: $(ls strict_test_r27_ci*.json 2>/dev/null | wc -l)"
          echo "R21 baseline files (from repo): $(ls strict_test_ci0_wi*.json 2>/dev/null | wc -l)"

      - name: OOS Evaluation
        run: python scripts/exp_strict_oos_r27.py test

      - name: Commit results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v9-results/strict_oos_r27_eval.json
          if git diff --cached --quiet; then
            echo "No changes to commit (eval file already up to date)."
          else
            git commit -m "R27 OOS eval: smart money momentum gate (mom 2.5/3.0/3.5)"
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null || git push origin "HEAD:master"