name: Expert WF Test

on:
  workflow_dispatch:
    inputs:
      wf_window:
        description: 'Window index (0-8)'
        required: true
        type: string

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install numpy pandas requests pyyaml
      
      - name: Run WalkForward Window ${{ inputs.wf_window }}
        run: cd fund && python scripts/expert_wf_runner.py ${{ inputs.wf_window }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: expert-wf-${{ inputs.wf_window }}
          path: fund/expert_wf_window${{ inputs.wf_window }}.json
