# R21 Strict OOS — 真并行 v3 (ci × 窗口块, 单进程无OOM, 少量artifact)
# 历史教训:
#   v1 (172独立job): 全部 success 但 artifact 上传丢失64个(108/172) → 聚合缺文件
#   v2 (4 job × xargs -P8): OOM exit 143, runner 被杀
#
# 本版 v3: 每个 ci 拆 6 块(b=0..5), 每块单进程顺序跑 7-8 个窗口。
#   - 单进程 → 无 OOM
#   - 4 ci × 6 块 = 24 job → 24 个 artifact, 上传可靠
#   - 每块 ≤8窗口 × ≤90s ≈ ≤12min; 24 job 并行 → 总时长 ~12min
#
# 块窗口划分:
#   b0: wi 0-7    b1: wi 8-15   b2: wi 16-22
#   b3: wi 23-29  b4: wi 30-36  b5: wi 37-42

name: R21 OOS Parallel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        ci: [0, 1, 2, 3]
        b: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: Decompress data
        run: |
          cd backtest/data
          gunzip -kf fund_charts.json.gz 2>/dev/null || true
          cd ../..

      - name: Run window block for candidate ${{ matrix.ci }} block ${{ matrix.b }} (sequential, single process)
        run: |
          python - <<'PY'
import sys
blocks = {
    0: range(0, 8),
    1: range(8, 16),
    2: range(16, 23),
    3: range(23, 30),
    4: range(30, 37),
    5: range(37, 43),
}
ci = int("${{ matrix.ci }}")
b = int("${{ matrix.b }}")
wins = ",".join(str(w) for w in blocks[b])
print(f"ci={ci} block={b} windows=[{wins}]")
PY
          for wi in $(python -c "import sys; ci=int('${{ matrix.ci }}'); b=int('${{ matrix.b }}'); blocks={0:range(0,8),1:range(8,16),2:range(16,23),3:range(23,30),4:range(30,37),5:range(37,43)}; print(' '.join(map(str,blocks[b])))"); do
            echo "[ci=${{ matrix.ci }} wi=$wi] $(date '+%H:%M')"
            timeout 90 python scripts/exp_strict_oos.py run ${{ matrix.ci }} "$wi" 2>&1 | tail -1 || echo "SKIP wi=$wi (timeout/error)"
          done

      - name: Count produced files
        run: |
          echo "train files: $(ls strict_ci${{ matrix.ci }}*.json 2>/dev/null | wc -l)"
          echo "test files:  $(ls strict_test_ci${{ matrix.ci }}*.json 2>/dev/null | wc -l)"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-ci${{ matrix.ci }}-b${{ matrix.b }}
          path: |
            strict_ci${{ matrix.ci }}*.json
            strict_test_ci${{ matrix.ci }}*.json
          if-no-files-found: warn

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Consolidate result files to repo root
        run: |
          mkdir -p v9-results
          find ./artifacts -name 'strict_ci*.json' -exec cp {} ./ \;
          find ./artifacts -name 'strict_test_ci*.json' -exec cp {} ./ \;
          echo "consolidated train: $(ls strict_ci*.json 2>/dev/null | wc -l)"
          echo "consolidated test:  $(ls strict_test_ci*.json 2>/dev/null | wc -l)"

      - name: OOS Evaluation
        run: python scripts/exp_strict_oos.py test

      - name: Commit results
        run: |
          ROUND=$(python -c "import sys; sys.path.insert(0,'scripts'); from exp_strict_oos import ROUND; print(ROUND)")
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add v9-results/strict_oos_r${ROUND}_eval.json
          git diff --cached --quiet || git commit -m "R21 OOS results (parallel v3 blocks): smart money modifier mode"
          git push