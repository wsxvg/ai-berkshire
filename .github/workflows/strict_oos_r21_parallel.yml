# R21 Strict OOS — 真并行 v2 (4 job × 内部 xargs 并行)
# 上一版 (172 独立 artifact) 因 artifact 过多在 download 阶段丢失 64 个 test 文件。
#
# 本版: 4 个 backtest job (ci=0..3)，每个 job 内部用 xargs -P8 并行跑 43 个窗口。
#   只有 4 个 artifact → download 不会丢。
#   xargs -P8: 单 runner 8 进程并行，43 窗口 ≈ ceil(43/8)=6 批。
#   4 job 并行 + 内部 8 并发 → 总时长远小于顺序版。
#
# 触发: workflow_dispatch

name: R21 OOS Parallel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ci: [0, 1, 2, 3]   # 4 个候选

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: Decompress data
        run: |
          cd backtest/data
          gunzip -kf fund_charts.json.gz 2>/dev/null || true
          cd ../..

      - name: Run all 43 windows for candidate ${{ matrix.ci }} (xargs -P8)
        run: |
          # 生成窗口列表，xargs -P8 并行跑，每个窗口独立进程
          seq 0 42 | xargs -P8 -I{} bash -c '
            wi="{}"
            ci="${{ matrix.ci }}"
            out=$(timeout 120 python scripts/exp_strict_oos.py run "$ci" "$wi" 2>&1 | tail -1)
            echo "[ci=$ci wi=$wi] $out"
            echo "$out" >> r21_ci${ci}_log.txt
          '
          echo "=== ci=${{ matrix.ci }} done ==="

      - name: Count produced files
        run: |
          echo "train files: $(ls strict_ci${{ matrix.ci }}*.json 2>/dev/null | wc -l)"
          echo "test files:  $(ls strict_test_ci${{ matrix.ci }}*.json 2>/dev/null | wc -l)"

      - name: Upload result (single artifact per ci)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-ci${{ matrix.ci }}
          path: |
            strict_ci${{ matrix.ci }}*.json
            strict_test_ci${{ matrix.ci }}*.json
          if-no-files-found: warn

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Consolidate result files to repo root
        run: |
          mkdir -p v9-results
          find ./artifacts -name 'strict_ci*.json' -exec cp {} ./ \;
          find ./artifacts -name 'strict_test_ci*.json' -exec cp {} ./ \;
          echo "consolidated train: $(ls strict_ci*.json 2>/dev/null | wc -l)"
          echo "consolidated test:  $(ls strict_test_ci*.json 2>/dev/null | wc -l)"

      - name: OOS Evaluation
        run: python scripts/exp_strict_oos.py test

      - name: Commit results
        run: |
          ROUND=$(python -c "import sys; sys.path.insert(0,'scripts'); from exp_strict_oos import ROUND; print(ROUND)")
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add v9-results/strict_oos_r${ROUND}_eval.json
          git diff --cached --quiet || git commit -m "R21 OOS results (parallel v2 xargs): smart money modifier mode"
          git push