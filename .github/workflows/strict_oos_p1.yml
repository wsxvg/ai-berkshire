# R20 Strict OOS — Sequential runner
# Runs all 130 backtests (63 train + 66 test + 1 final commit) on a single runner.
#
# R20: Smart Money 回调信号集成
#   - 60-day slide, 180 train + 90 test per window
#   - 43 windows total: 21 train (W0-W20) + 22 test (W21-W42)
#   - 3 candidates
#   - 信号验证独立集确定: topgain>=4, callback -10~-3%, net_buy>=1

name: R20 OOS

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  r20:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Train phase (63 backtests)
        run: |
          for ci in 0 1 2; do
            for wi in $(seq 0 20); do
              echo "[$ci:$wi] $(date '+%H:%M')"
              python scripts/exp_strict_oos.py run $ci $wi 2>&1 | tail -1
            done
          done

      - name: Test phase (66 backtests)
        run: |
          for ci in 0 1 2; do
            for wi in $(seq 21 42); do
              echo "[$ci:$wi] $(date '+%H:%M')"
              python scripts/exp_strict_oos.py run $ci $wi 2>&1 | tail -1
            done
          done

      - name: Count results
        run: echo "Train=$(ls strict_ci*_wi*.json 2>/dev/null | wc -l) Test=$(ls strict_test_ci*_wi*.json 2>/dev/null | wc -l)"

      - name: OOS Evaluation
        run: python scripts/exp_strict_oos.py test

      - name: Commit results
        run: |
          mkdir -p v9-results
          ROUND=$(python -c "import sys; sys.path.insert(0,'scripts'); from exp_strict_oos import ROUND; print(ROUND)")
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add v9-results/strict_oos_r${ROUND}_eval.json scripts/exp_strict_oos.py backtest/engine/backtest.py
          git commit -m "R20 OOS results: smart money callback signal (topgain>=4 + -10~-3%)"
          git push
