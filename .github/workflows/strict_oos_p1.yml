# R21 Strict OOS — Sequential runner
# Runs all 172 backtests (84 train + 88 test + 1 commit) on a single runner.
#
# R21: Smart Money 修饰符模式
#   - 同 R20 窗口划分 + BASELINE + SMART_BUY_15/25
#   - 新增 KC_SMART_MOD: smart_money 作加减分修饰符, 不占维度权重
#   - 预期: 上涨基金不扣分，只在回调+信号满足时给 +0.3~+0.5 加成

name: R21 OOS

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  r20:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Train phase (63 backtests)
        run: |
          for ci in 0 1 2 3; do
            for wi in $(seq 0 20); do
              echo "[$ci:$wi] $(date '+%H:%M')"
              timeout 90 python scripts/exp_strict_oos.py run $ci $wi 2>&1 | tail -1 || echo "SKIP ci=$ci wi=$wi (timeout/error)"
            done
          done

      - name: Test phase (66 backtests)
        run: |
          for ci in 0 1 2 3; do
            for wi in $(seq 21 42); do
              echo "[$ci:$wi] $(date '+%H:%M')"
              timeout 90 python scripts/exp_strict_oos.py run $ci $wi 2>&1 | tail -1 || echo "SKIP ci=$ci wi=$wi (timeout/error)"
            done
          done

      - name: Count results
        run: echo "Train=$(ls strict_ci*_wi*.json 2>/dev/null | wc -l) Test=$(ls strict_test_ci*_wi*.json 2>/dev/null | wc -l)"

      - name: OOS Evaluation
        run: python scripts/exp_strict_oos.py test

      - name: Commit results
        run: |
          mkdir -p v9-results
          ROUND=$(python -c "import sys; sys.path.insert(0,'scripts'); from exp_strict_oos import ROUND; print(ROUND)")
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add v9-results/strict_oos_r${ROUND}_eval.json scripts/exp_strict_oos.py backtest/engine/backtest.py
          git commit -m "R21 OOS results: smart money modifier mode (vs R20 original dimension mode)"
          git push
