name: Expert WF Parallel (all 9 windows)

on: workflow_dispatch

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        wf_window: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install numpy pandas requests pyyaml

      - name: Decompress data files
        run: |
          cd fund/backtest/data
          if [ ! -f fund_charts.json ]; then gunzip -k fund_charts.json.gz; fi
          ls -la *.json | head -10

      - name: Run WalkForward Window ${{ matrix.wf_window }}
        run: cd fund && python scripts/expert_wf_runner.py ${{ matrix.wf_window }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: expert-wf-${{ matrix.wf_window }}
          path: fund/expert_wf_window${{ matrix.wf_window }}.json

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          pattern: expert-wf-*
          merge-multiple: true
          path: artifacts
      
      - name: Aggregate Results
        run: |
          python3 << 'EOF'
          import json, glob
          results = []
          for f in sorted(glob.glob('artifacts/expert_wf_window*.json')):
              with open(f) as fh:
                  results.append(json.load(fh))
          
          labels = ['EXP_3P', 'EXP_2P', 'EXP_MOM', 'V8_ORIGINAL']
          print("\n" + "="*80)
          print("EXPERT WALK-FORWARD RESULTS (9 Windows)")
          print("="*80)
          print(f"\n{'Window':>6} {'Test Period':>24} " + " ".join(f"{l:>12}" for l in labels))
          print("-" * (30 + 12 * len(labels)))
          
          for r in results:
              wi = r['window']
              period = r['test_period']
              rets = [r['test_results'].get(l, {}).get('return', 0) for l in labels]
              ret_str = " ".join(f"{v:>+11.2f}%" for v in rets)
              print(f"{wi:>6} {period:>24} {ret_str}")
          
          print("-" * (30 + 12 * len(labels)))
          avgs = {}
          for l in labels:
              vals = [r['test_results'].get(l, {}).get('return', 0) for r in results]
              avgs[l] = sum(vals) / len(vals) if vals else 0
          print(f"{'AVG':>6} {'':>24} " + " ".join(f"{avgs[l]:>+11.2f}%" for l in labels))
          
          print("\n" + "="*80)
          print("WIN RATE (% of windows with positive return):")
          for l in labels:
              vals = [r['test_results'].get(l, {}).get('return', 0) for r in results]
              pos = sum(1 for v in vals if v > 0)
              print(f"  {l:12s}: {pos}/{len(vals)} = {pos/len(vals)*100:.0f}% windows positive")
          print("="*80)
          EOF
